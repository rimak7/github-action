name: demo pipeline

on:
    push:
        branches:
            - main
            - dev
    pull_request:
        branches: [main, dev]
              
    # schedule:
    #  - cron:  "*/5 * * * *"
jobs:
  setup_job:
    runs-on: ubuntu-latest  #macos-latest , windows-latest
    steps:
     - name: code checkout
       uses: actions/checkout@v4

  build_job:
    runs-on: windows-latest
    needs: [setup_job]
    steps:
     - name: checkout code
       uses: actions/checkout@v4
     - name: display hello
       run: echo hello  
    
  deploy_job: 
    runs-on: macos-latest
    needs: [build_job]
    steps:
     - name: checkout code
       uses: actions/checkout@v4   
     - name: see  
       run: cat README.md