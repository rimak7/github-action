name: Demo pipeline 
on:
  push:
    branches: 
      - main
      - dev
  pull_request:
    branches: [main, dev]
  #schedule:
      #- cron: "*/1 * * * *"
jobs:
  setup_job:
    runs-on: ubuntu-latest  # macos-latest , windows-latest 
    steps:
      - name: checkout repo
        uses: actions/checkout@v3
      - name: create file 
        run: |
           touch github-action.txt
           ls -la
           echo Hello world
      - name: print hello world
        run: echo Hello world
      - name: display readme file
        run: cat README.md
  build_job:
    needs: 
    - setup_job

    runs-on: windows-latest
    steps:
      - name: display hello
        run: echo hello 
      - name: display readme file
        run: cat github-actions.txt 
  deploy_job:
    needs: build_job
    runs-on: macos-latest
    steps:
      - run: echo hellow mac